[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pbmc-ageing-pipeline"
version = "0.1.0"
description = "Configuration-driven harmonization of PBMC ageing scRNA-seq studies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anndata>=0.10,<0.13",
  "celltypist>=1.6,<2",
  "openpyxl>=3.1,<4",
  "pandas>=2.0,<3",
  "scanpy>=1.10,<2",
  "scipy==1.16.0", # Prevents a segmentation fault in sc.tl.umap that happens for 1.16
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
qc = ["ipykernel>=6,<8", "nbconvert>=7,<8"]

[project.scripts]
pbmc-harmonize = "pbmc_pipeline.cli:main"
pbmc-qc = "pbmc_pipeline.qc:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
