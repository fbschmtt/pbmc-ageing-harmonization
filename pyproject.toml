[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pbmc-ageing-pipeline"
version = "0.1.0"
description = "Configuration-driven harmonization of PBMC ageing scRNA-seq studies"
readme = {text = "Configuration-driven harmonization of PBMC ageing scRNA-seq studies.", content-type = "text/markdown"}
requires-python = ">=3.11"
dependencies = [
  "anndata>=0.10,<0.13",
  "bbknn>=1.6,<2",
  "celltypist>=1.6,<2",
  "harmonypy==2.0.2",
  "jsonschema>=4.23,<5",
  "leidenalg>=0.10,<1",
  "openpyxl>=3.1,<4",
  "pydeseq2==0.5.4",
  "xlrd>=2.0,<3",
  "pandas>=2.0,<3",
  "scanpy>=1.10,<2",
  "scanorama>=1.7.4,<2",
  "scvi-tools>=1.4.3,<1.5",
  "scipy==1.16.0", # Prevents a segmentation fault in sc.tl.umap that happens for 1.16
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
qc = ["ipykernel>=6,<8", "jupytext>=1.16,<2", "nbconvert>=7,<8", "upsetplot>=0.9,<1"]

[project.scripts]
pbmc-harmonize = "pbmc_pipeline.cli:main"
pbmc-prepare = "pbmc_pipeline.prepare_cli:main"
pbmc-qc = "pbmc_pipeline.qc:main"
pbmc-merge = "pbmc_pipeline.merge_cli:main"
pbmc-merge-qc = "pbmc_pipeline.merge_qc:main"
pbmc-cell-type = "pbmc_pipeline.cell_type:main"
pbmc-cell-type-report = "pbmc_pipeline.cell_type_report:main"
pbmc-cell-type-manifest = "pbmc_pipeline.cell_type_manifest:main"
pbmc-differential-expression = "pbmc_pipeline.differential_expression:main"
pbmc-trajectory-report = "pbmc_pipeline.trajectory_report:main"
pbmc-integration-benchmark = "pbmc_pipeline.integration_benchmark:main"
pbmc-integration-benchmark-report = "pbmc_pipeline.integration_benchmark_qc:main"
pbmc-manifest = "pbmc_pipeline.manifest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
